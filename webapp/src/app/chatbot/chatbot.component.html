<!-- Floating button -->
<button class="chat-fab" (click)="toggle()" [class.open]="isOpen">
  <img *ngIf="!isOpen" src="assets/logo.jpg" alt="Sougui" class="fab-logo"/>
  <span *ngIf="isOpen">✕</span>
</button>

<!-- Chat window -->
<div class="chat-window" *ngIf="isOpen">
  <div class="chat-header">
    <div class="chat-header-info">
      <img src="assets/logo.jpg" alt="Sougui" class="chat-avatar"/>
      <div>
        <div class="chat-title">Assistant Sougui</div>
        <div class="chat-status">En ligne</div>
      </div>
    </div>
  </div>

  <div class="chat-messages" #messagesContainer>
    <div *ngFor="let msg of messages"
         class="chat-bubble"
         [class.user]="msg.role === 'user'"
         [class.assistant]="msg.role === 'assistant'">
      {{ msg.content }}
    </div>
    <div *ngIf="loading" class="chat-bubble assistant typing">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <div class="chat-input-bar">
    <input
      type="text"
      [(ngModel)]="userInput"
      placeholder="Posez votre question..."
      (keyup.enter)="send()"
      [disabled]="loading"
    />
    <button (click)="send()" [disabled]="loading || !userInput.trim()">
      ➤
    </button>
  </div>
</div>
